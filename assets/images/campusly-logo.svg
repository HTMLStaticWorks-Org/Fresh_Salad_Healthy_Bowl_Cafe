<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 72" width="300" height="72">
  <defs>
    <!-- Fresh Botanical Gradients -->
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22c55e" />
      <stop offset="55%" stop-color="#16a34a" />
      <stop offset="100%" stop-color="#15803d" />
    </linearGradient>
    <linearGradient id="sproutGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#65a30d" />
      <stop offset="100%" stop-color="#a3e635" />
    </linearGradient>
    <linearGradient id="bowlGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#16a34a" />
      <stop offset="60%" stop-color="#0d9488" />
      <stop offset="100%" stop-color="#115e59" />
    </linearGradient>
  </defs>

  <!-- Fresh Salad & Healthy Bowl Symbol (Enlarged Brand Logo) -->
  <g transform="translate(8, 7) scale(1.16)">
    <!-- Soft organic background halo -->
    <circle cx="26" cy="26" r="24" fill="#16a34a" opacity="0.10" />
    <circle cx="26" cy="26" r="24" fill="none" stroke="url(#leafGrad)" stroke-width="1.5" opacity="0.55" />

    <!-- Left Sprout Leaf -->
    <path d="M25,24 C15,22 12,13 16,8 C22,9 26,15 25,24 Z" fill="url(#sproutGrad)" />
    <!-- Right Botanical Leaf -->
    <path d="M26,24 C36,21 39,12 35,7 C29,9 25,15 26,24 Z" fill="url(#leafGrad)" />
    <!-- Center Tall Leaf -->
    <path d="M25.5,24 C21,16 22,7 26,4 C30,7 31,16 25.5,24 Z" fill="#16a34a" />
    <!-- Citrus / Carrot Harvest Dot -->
    <circle cx="19" cy="22" r="2.6" fill="#ea580c" />
    <circle cx="33" cy="22" r="2.2" fill="#84cc16" />

    <!-- Artisan Bowl Silhouette -->
    <path d="M10,25 L42,25 C42,35.5 34.8,42 26,42 C17.2,42 10,35.5 10,25 Z" fill="url(#bowlGrad)" />
    <!-- Bowl Rim Highlight -->
    <rect x="9" y="23.5" width="34" height="2.8" rx="1.4" fill="#15803d" />
    <!-- Bowl Base Foot -->
    <rect x="20" y="42.5" width="12" height="2.5" rx="1.2" fill="#115e59" />
  </g>

  <!-- Wordmark (Enlarged Brand Name & Subtext) -->
  <g transform="translate(76, 21)">
    <!-- VERDURE main logotype (Enlarged) -->
    <text x="0" y="22" font-family="'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="29" font-weight="800" letter-spacing="3.8" fill="#132a1e">
      VERDURE
    </text>

    <!-- Tagline / Subtitle (Enlarged Subtext) -->
    <text x="1" y="39" font-family="'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="1.9" fill="#16a34a">
      FRESH SALAD &amp; BOWL CAFE
    </text>
  </g>
</svg>
